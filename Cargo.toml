[workspace]
resolver = "2"
members = [
    "crates/pdf-kernel",
    "crates/memory-governor",
    "crates/tile-engine",
    "crates/gpu-compositor",
    "crates/text-engine",
    "crates/annot-engine",
    "crates/color-engine",
    "crates/fuzz-engine",
    "crates/viewer-shell",
    "crates/meridian-bridge", "crates/qdc-genome", "crates/qdc-win-bridge", "crates/speech-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
pdfium-render = "0.8"
image = "0.25"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
wgpu = "24.0"
bytemuck = { version = "1.21", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1.10"
rustybuzz = "0.18"
icu = "1.5"
tantivy = "0.22"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }

[profile.release]
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
