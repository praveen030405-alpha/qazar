name: Build iPadOS Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iPad App
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios
          
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Rust Core (meridian-bridge)
        run: |
          cd crates/meridian-bridge
          cargo rustc --target aarch64-apple-ios --release -- --crate-type staticlib

      - name: Build iOS/iPadOS App
        run: |
          cd ipad-app
          xcodebuild clean build -project QuantumPDFViewer.xcodeproj -scheme QuantumPDFViewer -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Package to IPA (Unsigned for Sideloading)
        run: |
          mkdir -p Payload
          # Assuming the build output is in the standard derived data path or build folder
          # Copy the .app into Payload and zip it
          # mv build/Release-iphoneos/QuantumPDFViewer.app Payload/
          # zip -r QuantumPDFViewer.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumPDFViewer-iPad
          path: Payload/ # This would be the .ipa path in a real pipeline
