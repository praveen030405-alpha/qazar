[package]
name = "meridian-bridge"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
pdf-kernel = { path = "../pdf-kernel" }
text-engine = { path = "../text-engine" }
annot-engine = { path = "../annot-engine" }
color-engine = { path = "../color-engine" }
memory-governor = { path = "../memory-governor" }
jni = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
android_logger = "0.15"
image = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
base64 = "0.22"
uuid = { workspace = true }
uniffi = "0.27"

[build-dependencies]
uniffi = { version = "0.27", features = ["build"] }
